# SIBN DPS model — все числовые допущения. Ничего не хардкодить в коде.
# version: бампать при любом смысловом изменении допущений — попадает в отчёт
# для воспроизводимости.
version: "0.1.0-mvp"

seed: 42

company:
  ticker: "MOEX:SIBN"          # идентификатор в Financemarker API
  moex_secid: "SIBN"           # для MOEX ISS (курсы/цены)
  # Кол-во акций уточняется из API (/shares, последняя запись); это значение —
  # fallback, если API недоступен.
  n_shares_fallback: 4_741_299_639

fiscal:
  # Годовые МСФО-отчёты, используемые для калибровки (Блок 3) и бэктеста (Блок 5).
  history_start_year: 2021
  history_end_year: 2025
  # Бэктест: допуск ±15% в fallback-режиме налогов (см. Блок 5 ТЗ).
  backtest_tolerance: 0.15

physical:
  # Урал/Сибирская нефть: тонна -> баррель. Для товарной нефти РФ используется
  # диапазон 7.28–7.35 bbl/т; берём среднее по отрасли.
  bbl_per_tonne_oil: 7.33
  # Доля добытой нефти, перерабатываемой на собственных НПЗ (не экспортируется
  # как сырая нефть). У СИБН эта доля аномально высока для РФ. Если операционные
  # данные по добыче отсутствуют за год (разрыв раскрытия 2021-2022 в Financemarker),
  # используется последнее известное значение (forward-fill).
  domestic_refining_share_fallback: 0.80

netback:
  # Urals-to-Brent дисконт, $/bbl. Диапазон для 2026 (из ТЗ): 17..32.
  discount_usd_per_bbl:
    min: 17.0
    base: 20.0
    max: 32.0
  # Фрахт + логистика экспортной нефти, $/bbl. Грубая оценка на основе типичных
  # ставок Балтика/ЧФ-Азия для российского экспорта; уточнить перед публикацией.
  freight_logistics_usd_per_bbl: 2.5
  # Downstream (переработка): маржа "крэк-спреда" на тонну нефтепродуктов, $/т.
  # ГРУБОЕ ДОПУЩЕНИЕ: сегментной ($) отчётности по переработке в источнике нет
  # (только физические объёмы), поэтому downstream-netback — параметр модели,
  # а не наблюдаемая величина. Используется как относительный сигнал масштаба
  # для регрессии маржи (Блок 3), НЕ как точная посегментная P&L-оценка.
  downstream_margin_usd_per_tonne: 60.0

  scenario_shocks:
    # Сценарный шок объёма переработки (например, атаки на НПЗ), доля от базового объёма.
    refining_volume_shock: 0.0

tax:
  mode: "effective_rate_fallback"   # "effective_rate_fallback" | "ndpi_damper_exact" (Этап 4)
  effective_rate_fallback:
    # ⚠️ НЕ откалибровано регрессией на отчётности SIBN, как изначально
    # предполагалось в ТЗ: в Financemarker reports нет отдельной строки НДПИ/
    # экспортной пошлины (cost_of_sales есть только за 2025 год, cash_paid_for_tax
    # всегда null) — выделить налоговый клин из консолидированной отчётности
    # физически нечем. Вместо этого — иллюстративная функция с реалистичной
    # структурой российского нефтяного налогообложения (порог + предельная
    # ставка), параметры взяты из публичных оценок налогового клина по Urals,
    # НЕ подогнаны под конкретные цифры SIBN. Ключевое свойство (прогрессивность:
    # налог падает быстрее выручки при снижении цены) гарантировано формой
    # функции и проверяется тестом. Уточнить на реальных данных НДПИ в Этапе 4.
    threshold_usd_per_bbl: 15.0     # "Дм"-подобный вычитаемый порог формулы НДПИ
    marginal_rate: 0.63             # предельная доля изъятия сверх порога
    clip_min: 0.0
    clip_max: 0.70
  ndpi_damper_exact:
    # Заготовка под точный расчёт НДПИ + демпфер (гл. 26 НК РФ) — Этап 4.
    # Коэффициенты меняются законодательно, поэтому только в конфиге.
    mineral_extraction_tax_base_rate: null   # TODO Этап 4
    damper_coefficients: null                # TODO Этап 4

margins:
  # Регрессия EBITDA%/NI% на ценовой драйвер (Блок 3) калибруется на n=5 годовых
  # точках (2021-2025) — статистически слабая мощность, R²/остатки выводятся
  # явно в отчёте. Клип защищает от абсурдных экстраполяций регрессии на n=5
  # точках при экстремальных сценарных ценах (напр. отрицательная EBITDA-маржа).
  ebitda_margin_clip: [0.05, 0.55]
  ni_margin_clip: [0.0, 0.35]
  fcf_margin_clip: [-0.05, 0.30]

payout:
  base_ratio: 0.75
  stress_ratio: 0.50
  net_debt_ebitda_stress_threshold: 1.5

debt:
  # Простая модель: долг растёт на величину дефицита, если FCF после дивидендов
  # отрицателен; иначе не меняется (без досрочного погашения).
  roll_forward: true
  # Ставка = среднее interest_expense/net_debt за последние waterfall.trailing_years
  # лет (см. model/margins.py::historical_pnl_detail). Это блендированная
  # балансовая ставка по НАКОПЛЕННОМУ долгу (часть — старые низкие ставки),
  # НЕ маржинальная стоимость нового заимствования (та выше, ~16%,
  # см. Instruments/DCF/my_dcf.ipynb). Проценты в модели начисляются на весь
  # net_debt целиком — приближение, оправданное требованием "долг моделируй просто".
  interest_rate_on_net_debt_fallback: 0.075

waterfall:
  # Компоненты P&L между EBITDA и чистой прибылью (D&A%, ставка по долгу,
  # эффективная ставка налога на прибыль, доля миноритариев) НЕ управляются
  # netback-регрессией (в отличие от EBITDA-маржи) — это структурные/учётные
  # величины, которые берём как среднее за последние N отчётных лет.
  trailing_years: 3

monte_carlo:
  n_paths: 10000
  copula: "gauss"          # "gauss" | "student_t" — сравниваются в Этапе 2
  student_t_df: 5
  calibration_window_start: "2022-01-01"

data_sources:
  findata:
    base_url_env: "FINDATA_API_URL"
    token_env: "FINDATA_API_TOKEN"
    include: "reports,ratios,shares,dividends,summary,operations"
  fx_usdrub:
    provider: "cbr"
    url: "https://www.cbr.ru/scripts/XML_dynamic.asp"
    valuta_code: "R01235"    # USD, код ЦБ РФ
  brent:
    # Stooq теперь требует JS-верификацию бота и недоступен для скриптового
    # запроса (проверено). FRED отдаёт тот же ряд (Brent - Europe, $/bbl)
    # без ключа и авторизации, надёжнее для воспроизводимости.
    provider: "fred"
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv"
    series_id: "DCOILBRENTEU"
  urals:
    provider: "manual_csv"
    path: "data/manual/urals_minfin.csv"

cache:
  dir: "data/cache"
  format: "parquet"
  ttl_hours: 24
