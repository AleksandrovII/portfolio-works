# base — консенсусные средние: Urals ~$50-59 (при дисконте $17-23 к Brent
# ~$70-80), текущий курс USD/RUB.
name: base
description: "Консенсусные средние: Urals ~$50-59, дисконт $17-23, текущий курс"

discount_usd_per_bbl:
  min: 17.0
  base: 20.0
  max: 23.0

# Явный фиксированный старт (НЕ "живой" спот из calibration.py) — нужен для
# воспроизводимости: если бы base зависел от даты запуска, сценарии нельзя
# было бы честно сравнивать между собой, и прогон не воспроизводился бы
# завтра. Urals ~$50-59 (середина 54.5) + дисконт $20 => Brent ≈ 74.5.
brent_spot_override_usd: 74.5
fx_shift_multiplier: 1.0

netback:
  refining_volume_shock: 0.0
