# escalation — эскалация санкций/логистических ограничений: добыча РФ
# -0.3..-0.5 млн б/с, переработка -15%..-25% (атаки на НПЗ), дисконт Urals
# расширяется до $27-32, рубль слабеет через бюджетное ограничение (дешёвая
# нефть -> меньше валютной выручки бюджета -> слабее рубль).
name: escalation
description: "РФ-добыча -0.3..-0.5 мбс, переработка -15%..-25%, дисконт $27-32, слабый рубль"

discount_usd_per_bbl:
  min: 27.0
  base: 29.5
  max: 32.0

# Глобальный Brent в этой упрощённой модели не переоценивается из-за
# специфичного для РФ сокращения добычи (эффект на мировой баланс не
# моделируется отдельно) — тот же фиксированный старт, что и base (74.5),
# чтобы сценарии сравнивались при прочих равных по цене, и разница в DPS
# шла именно от дисконта/переработки/курса, а не от разных цен на Brent.
brent_spot_override_usd: 74.5

# Связь "дешёвая нефть -> слабый рубль" через бюджетное ограничение:
# иллюстративный мультипликатор ослабления рубля, НЕ откалиброван econometрически
# (данных о прошлых эпизодах сопоставимой эскалации недостаточно) — параметр
# для дальнейшей калибровки.
fx_shift_multiplier: 1.12

netback:
  # Середина диапазона -15%..-25% из ТЗ
  refining_volume_shock: -0.20
  # РФ-добыча -0.3..-0.5 мбс не моделируется отдельной переменной в MVP
  # (нет посегментного объёма добычи по годам после 2022, см. README) —
  # отражена косвенно через refining_volume_shock и расширенный дисконт.
