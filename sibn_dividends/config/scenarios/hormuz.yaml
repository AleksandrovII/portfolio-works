# hormuz — блокада/эскалация вокруг Ормузского пролива: Urals $90-116
# (апрельский факт 2026 — уже частично реализовался в фактических данных
# Brent 2026: скачок к ~$95-100 в Q2, затухание к ~$69-70 к июлю), рубль
# временно крепче на фоне повышенной экспортной выручки, эффект длится ~полгода, затем
# возврат к base.
#
# УПРОЩЕНИЕ: полноценная траектория "скачок -> затухание за 6 месяцев"
# внутри дневного случайного блуждания не реализована в MVP (потребовала бы
# time-varying overlay поверх симуляции путей, см. montecarlo.py). Вместо
# этого используется БЛЕНДИРОВАННЫЙ годовой Brent-спот, привязанный к ТОЙ ЖЕ
# базе, что и сценарий base (74.5 — иначе сравнение сценариев некорректно,
# см. base.yaml): ~6 мес на пике (Urals $90-116, середина $103, + дисконт
# $20 => Brent ~$123) + ~6 мес возврата к базовому Brent (74.5) =>
# среднегодовое ~(123+74.5)/2 ≈ 99. Это огрубляет форму распределения (даёт
# узкую МК-дисперсию вокруг блендированного среднего вместо бимодальной
# "полгода-высоко/полгода-низко" картины) — задел для следующей итерации.
name: hormuz
description: "Urals $90-116 на полгода (пик Ормуз), затем возврат к base; блендированный годовой Brent"

discount_usd_per_bbl:
  min: 17.0
  base: 20.0
  max: 23.0

brent_spot_override_usd: 99.0

# Крепче рубль на пике экспортной выручки, блендировано за год.
fx_shift_multiplier: 0.95

netback:
  refining_volume_shock: 0.0
