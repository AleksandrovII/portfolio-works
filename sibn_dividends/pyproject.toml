[project]
name = "sibn-dividends"
version = "0.1.0"
description = "Scenario model for PJSC Gazprom Neft (SIBN) dividend-per-share forecasting"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
